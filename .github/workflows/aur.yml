name: AUR Package & Publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".github/scripts/sync-packages.py"
      - ".github/workflows/aur.yml"
  schedule:
    # 每小时整点自动检测并同步上游最新版本
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新构建所有包 (true/false)"
        required: false
        default: "false"

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  aur:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check upstream releases and update PKGBUILDs
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ github.event.inputs.force || 'false' }}
        run: |
          python3 .github/scripts/sync-packages.py

      - name: Prepare existing repository database from Release
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING_DB: ${{ steps.meta.outputs.missing_db }}
          OBSOLETE_ASSETS: ${{ steps.meta.outputs.obsolete_assets }}
        run: |
          mkdir -p packages/repo
          if gh release view repo --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$MISSING_DB" = "true" ]; then
              echo "Database assets missing in Release; downloading existing .pkg.tar.zst assets to rebuild DB..."
              gh release download repo --repo "${{ github.repository }}" -p "*.pkg.tar.zst" -D packages/repo --clobber || true
              for asset in $OBSOLETE_ASSETS; do
                rm -f "packages/repo/$asset"
              done
            else
              echo "Downloading existing repository database from Release..."
              gh release download repo --repo "${{ github.repository }}" -p "aslz.db.tar.gz" -p "aslz.files.tar.gz" -D packages/repo --clobber || true
            fi
          fi

      - name: Compile updated packages and update repo database
        if: steps.meta.outputs.skip != 'true'
        env:
          BUILD_PKGS: ${{ steps.meta.outputs.build_pkgs }}
          REMOVED_PKGS: ${{ steps.meta.outputs.removed_pkgs }}
        run: |
          docker run --rm \
            -e BUILD_PKGS="$BUILD_PKGS" \
            -e REMOVED_PKGS="$REMOVED_PKGS" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD/packages:/packages" \
            -w /packages \
            archlinux:base-devel bash -c '
              set -euo pipefail
              pacman -Sy --noconfirm --needed archlinux-keyring
              pacman -Su --noconfirm --needed python
              groupadd -g "$HOST_GID" -o builder
              useradd -u "$HOST_UID" -g "$HOST_GID" -o -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 440 /etc/sudoers.d/builder
              chown -R builder:builder .
              mkdir -p repo
              for pkg_name in $BUILD_PKGS; do
                pkg_dir="${pkg_name}/"
                if [ -f "${pkg_dir}PKGBUILD" ]; then
                  echo "Building updated package in ${pkg_dir}..."
                  (cd "$pkg_dir" && su builder -c "makepkg --printsrcinfo > .SRCINFO && makepkg -s -d --noconfirm")
                  cp "${pkg_dir}"*.pkg.tar.zst repo/
                fi
              done
              cd repo
              if [ -f aslz.db.tar.gz ] && [ -n "$REMOVED_PKGS" ]; then
                repo-remove aslz.db.tar.gz $REMOVED_PKGS || true
              fi
              shopt -s nullglob
              pkgs=(*.pkg.tar.zst)
              if (( ${#pkgs[@]} )); then
                repo-add aslz.db.tar.gz "${pkgs[@]}"
              fi
              rm -f *.old
              if [ -f aslz.db.tar.gz ]; then
                cp -f --remove-destination aslz.db.tar.gz aslz.db
                cp -f --remove-destination aslz.files.tar.gz aslz.files
              fi
              chown -R builder:builder /packages
            '

      - name: Publish Pacman Repository to GitHub Releases
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OBSOLETE_ASSETS: ${{ steps.meta.outputs.obsolete_assets }}
        run: |
          gh release view repo --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create repo --repo "${{ github.repository }}" --title "Pacman Repository (x86_64)" --notes "Automated rolling binary repository for [aslz]"

          cd packages/repo

          # 清理已过期的旧版本包资产
          for asset in $OBSOLETE_ASSETS; do
            echo "Deleting obsolete asset from repo release: $asset"
            gh release delete-asset repo "$asset" --repo "${{ github.repository }}" -y || true
          done

          shopt -s nullglob
          upload_files=(*)
          if (( ${#upload_files[@]} )); then
            gh release upload repo "${upload_files[@]}" --repo "${{ github.repository }}" --clobber
          fi

      - name: Commit updated package files to repository
        if: steps.meta.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_zh.md packages/*/PKGBUILD packages/*/.SRCINFO
          if ! git diff --cached --quiet; then
            git fetch origin main
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] && \
               [ "$(git log -1 --pretty=%s)" = "chore: auto-update packages [skip ci]" ]; then
              git commit --amend --no-edit --reset-author
              git push --force-with-lease origin main
            else
              git commit -m "chore: auto-update packages [skip ci]"
              git pull --rebase -X ours origin main
              git push origin main
            fi
          fi
